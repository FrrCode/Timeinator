# Keeps CHANGELOG.md in step with main, and turns a pushed v* tag into a GitHub
# release whose notes are that version's changelog section.
name: Changelog

on:
  push:
    branches: [main]
    tags: ["v*"]
    # This workflow's own commit touches only CHANGELOG.md. (Path filters are
    # not applied to tag pushes, so tags always run.)
    paths-ignore: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

# Queued, never cancelled: aborting a run halfway through its commit and push
# would leave main behind the history it describes. One group per ref, because a
# group holds a single pending run and drops the rest: `just release` pushes the
# branch and the tag together, and sharing a group cancelled the tag's run. Only
# the branch run commits, so the two cannot race on main.
concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      # main, even on a tag push, so a tag run still updates the branch. The full
      # history and every tag are what the changelog is built from.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The tag's section is already there: the atomic push put the tag on the
      # remote before either run started.
      - name: Regenerate and commit
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          node scripts/changelog.ts
          # status, not diff: diff ignores the file while it is still untracked.
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): regenerate" -- CHANGELOG.md
          git push origin HEAD:main

      # A pushed tag is not a release: GitHub shows it with an empty body until
      # something creates one. Edits an existing release, so reruns are safe.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/changelog.ts --notes "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          fi
